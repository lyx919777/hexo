# ==========================================================
# AnZhiYu 主题配置
# ==========================================================

# 菜单导航
menu:
  文章:
    归档: /archives/ || anzhiyu-icon-box-archive
    # 分类: /categories/ || anzhiyu-icon-shapes
    # 标签: /tags/ || anzhiyu-icon-tags
  # 关于:
  #   关于本人: /about/ || anzhiyu-icon-paper-plane

# 社交链接
social:
  GitHub: https://github.com/lyx919777 || anzhiyu-icon-github
  CSDN: https://blog.csdn.net/liu20120919 || anzhiyu-icon-csdn

# 首页顶部配置
home_top:
  enable: true
  timemode: date
  title: lyx919的blog
  subTitle: 记录技术，分享生活。
  siteText: github.com/lyx919777
  category:
    - name: OI
      path: /categories/OI/
      shadow: var(--anzhiyu-shadow-blue)
      class: blue
      icon: anzhiyu-icon-code
    - name: 开发
      path: /categories/开发/
      shadow: var(--anzhiyu-shadow-red)
      class: red
      icon: anzhiyu-icon-laptop-code
    - name: 生活
      path: /categories/生活/
      shadow: var(--anzhiyu-shadow-green)
      class: green
      icon: anzhiyu-icon-book
  default_descr: 欢迎来到 lyx919 的博客！
  banner:
    tips: 🔥 新项目
    title: Hello World
    image: https://bu.dusays.com/2023/05/13/645fa3cf90d70.webp
    link: /2026/06/05/hello-world/

# 作者信息
author_status:
  enable: true
  statusImg: "https://bu.dusays.com/2023/08/24/64e6ce9c507bb.png"
  skills:
    - 💻 全栈开发者
    - 🔍 热爱开源与技术分享

# 头像
avatar:
  img: "https://bu.dusays.com/2023/04/27/64496e511b09c.jpg"
  effect: true

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  custom_text: '<a href="https://github.com/lyx919777">GitHub</a> | <a href="https://blog.csdn.net/liu20120919">CSDN</a>'
  runtime:
    enable: false
  footerBar:
    enable: true
    authorLink: /
    cc:
      enable: false
    linkList:
      - link: https://github.com/lyx919777
        text: GitHub
      - link: https://blog.csdn.net/liu20120919
        text: CSDN

# 深色模式
display_mode: both

# 主色调
theme_color:
  enable: true
  main: "#425AEF"
  dark_main: "#f2b94b"

# 代码高亮
highlight_theme: light
highlight_copy: true
highlight_lang: true
highlight_shrink: false
code_word_wrap: false

# 文章设置
post_copyright:
  enable: true
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 搜索
local_search:
  enable: false
  preload: true

# 字数统计
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 打赏（关闭）
reward:
  enable: false

# 音乐播放器
nav_music:
  enable: true
  id: 8152976493
  server: netease
  volume: 0.7

# 欢迎语
greetingBox:
  enable: false

# 标签卖萌
diytitle:
  enable: true
  leaveTitle: w(ﾟДﾟ)w 不要走！再看看嘛！
  backTitle: ♪(^∇^*)欢迎肥来！

# 文章顶部摘要
post_head_ai_description:
  enable: false

# 首页随便逛逛（people模式）
peoplecanvas:
  enable: true
  img: https://bu.dusays.com/2024/07/27/66a4fe67be5b8.png

# Pjax
pjax:
  enable: true

# 背景特效
universe:
  enable: true
