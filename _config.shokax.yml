# ==========================================================
# ShokaX 主题配置
# 此文件覆盖 node_modules/hexo-theme-shokax/_config.yml
# ==========================================================

# 站点大标题
alternate: 我的博客

# 静态文件根目录
statics: "/"
assets: "assets"
css: "css"
js: "js"

# 全站黑白滤镜
grayMode: false

# PWA
pwa:
  enable: false

# 实验性特性
experiments:
  mobileWidth: 820px
  copyrightLength: 50
  antiFakeWebsite: true

# 封面图列表（至少6张，用于首页随机背景）
image_list:
  - /assets/404.png
  - /assets/apple-touch-icon.png
  - /assets/search.png
  - /assets/failure.ico
  - /assets/favicon.ico
  - /assets/logo.svg

# 首页图片列表（为空则使用 image_list）
index_images: []

# 封面图服务器（设置后使用在线图片，优先级最高）
image_server: "https://picsum.photos/800/600"

# 首页配置
homeConfig:
  gradient: true
  fixedCover: ""
  coverConfig:
    enableCover: true
    enablePreload: true
    enableNextGradientCover: false

# 模块
modules:
  debug: false
  player: true
  fireworks: true
  visibilityListener: true
  tabs: true
  quiz: true
  cloudflarePatch: false

# 暗色模式
darkmode: true
auto_dark:
  enable: true
  start: "20:00"
  end: "6:00"

# 加载动画
loader:
  start: true

# 鼠标点击烟花
fireworks:
  enable: true
  colors:
    - "#FF6B6B"
    - "#4ECDC4"
    - "#45B7D1"
    - "#96CEB4"
    - "#FFEAA7"

# 字体
font:
  enable: true
  global-font: '"Noto Sans SC", "Microsoft YaHei", sans-serif'
  global-font-size: 16px
  code-font: '"Fira Code", "Consolas", monospace'
  font-size: 14px
  font-color: "#4c4948"
  code-font-size: 90%

# 菜单导航
menu:
  home: / || home
  posts:
    default: / || feather
    archives: /archives/ || list-alt
  # about: /about/ || user

# 社交链接
social:
  github: https://github.com/lyx919777 || github || "#191717"

# 侧边栏
sidebar:
  position: left
  avatar: avatar.jpg

# 小工具
widgets:
  random_posts: true
  recent_comments: true

# 页脚
footer:
  since: 2026
  icon:
    name: sakura rotate
    color: "#ffc0cb"
  count: true
  powered: true
  icp:
    enable: false

# 文章设置
post:
  wordCount: true
  readingTime: true

# 搜索
search:
  enable: true
  type: pagefind

# 评论系统（暂未启用）
twikoo:
  enable: false
waline:
  enable: false
